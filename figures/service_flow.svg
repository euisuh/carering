<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="-apple-system, 'Noto Sans KR', sans-serif">
  <rect width="900" height="340" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="17" font-weight="800" fill="#f0f0f0" letter-spacing="-0.5">케어링 서비스 흐름</text>
  <text x="450" y="57" text-anchor="middle" font-size="11" fill="#555">보호자 설정 → AI 발신 통화 → 음성 분석 → 리포트 전송</text>

  <!-- STEP 1: Guardian sets schedule -->
  <rect x="40" y="95" width="165" height="150" rx="10" fill="#111" stroke="#1e3a6e" stroke-width="1.5"/>
  <rect x="40" y="95" width="165" height="4" rx="2" fill="#4f8ef7"/>
  <text x="73" y="122" font-size="10" font-weight="700" fill="#4f8ef7" letter-spacing="0.08em">STEP 01</text>
  <text x="122" y="150" text-anchor="middle" font-size="28">📱</text>
  <text x="122" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f0f0">보호자 설정</text>
  <text x="122" y="196" text-anchor="middle" font-size="10" fill="#666">통화 주기 · 시간대 설정</text>
  <text x="122" y="210" text-anchor="middle" font-size="10" fill="#666">어르신 관심사 입력</text>
  <text x="122" y="224" text-anchor="middle" font-size="10" fill="#666">가족 공유 설정</text>

  <!-- Arrow 1 -->
  <line x1="207" y1="170" x2="248" y2="170" stroke="#2a2a2a" stroke-width="2"/>
  <polygon points="248,164 260,170 248,176" fill="#4f8ef7"/>
  <text x="234" y="162" text-anchor="middle" font-size="9" fill="#444">스케줄</text>
  <text x="234" y="185" text-anchor="middle" font-size="9" fill="#444">등록</text>

  <!-- STEP 2: AI Call -->
  <rect x="262" y="95" width="165" height="150" rx="10" fill="#111" stroke="#14532d" stroke-width="1.5"/>
  <rect x="262" y="95" width="165" height="4" rx="2" fill="#22c55e"/>
  <text x="295" y="122" font-size="10" font-weight="700" fill="#22c55e" letter-spacing="0.08em">STEP 02</text>
  <text x="344" y="150" text-anchor="middle" font-size="28">📞</text>
  <text x="344" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f0f0">AI 발신 통화</text>
  <text x="344" y="196" text-anchor="middle" font-size="10" fill="#666">기존 전화기로 자동 발신</text>
  <text x="344" y="210" text-anchor="middle" font-size="10" fill="#666">LLM 한국어 자유 대화</text>
  <text x="344" y="224" text-anchor="middle" font-size="10" fill="#666">개인화 대화 스크립트</text>

  <!-- Arrow 2 -->
  <line x1="429" y1="170" x2="470" y2="170" stroke="#2a2a2a" stroke-width="2"/>
  <polygon points="470,164 482,170 470,176" fill="#22c55e"/>
  <text x="456" y="162" text-anchor="middle" font-size="9" fill="#444">통화</text>
  <text x="456" y="185" text-anchor="middle" font-size="9" fill="#444">오디오</text>

  <!-- STEP 3: Analysis -->
  <rect x="484" y="95" width="165" height="150" rx="10" fill="#111" stroke="#422006" stroke-width="1.5"/>
  <rect x="484" y="95" width="165" height="4" rx="2" fill="#f59e0b"/>
  <text x="517" y="122" font-size="10" font-weight="700" fill="#f59e0b" letter-spacing="0.08em">STEP 03</text>
  <text x="566" y="150" text-anchor="middle" font-size="28">🔬</text>
  <text x="566" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f0f0">음성 건강 분석</text>
  <text x="566" y="196" text-anchor="middle" font-size="10" fill="#666">응답 지연 · 발화 속도</text>
  <text x="566" y="210" text-anchor="middle" font-size="10" fill="#666">침묵 빈도 분석</text>
  <text x="566" y="224" text-anchor="middle" font-size="10" fill="#666">감정 임베딩 추출</text>

  <!-- Arrow 3 -->
  <line x1="651" y1="170" x2="692" y2="170" stroke="#2a2a2a" stroke-width="2"/>
  <polygon points="692,164 704,170 692,176" fill="#f59e0b"/>
  <text x="678" y="162" text-anchor="middle" font-size="9" fill="#444">분석</text>
  <text x="678" y="185" text-anchor="middle" font-size="9" fill="#444">결과</text>

  <!-- STEP 4: Report -->
  <rect x="706" y="95" width="155" height="150" rx="10" fill="#111" stroke="#3d0764" stroke-width="1.5"/>
  <rect x="706" y="95" width="155" height="4" rx="2" fill="#a855f7"/>
  <text x="737" y="122" font-size="10" font-weight="700" fill="#a855f7" letter-spacing="0.08em">STEP 04</text>
  <text x="783" y="150" text-anchor="middle" font-size="28">📊</text>
  <text x="783" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f0f0">리포트 발송</text>
  <text x="783" y="196" text-anchor="middle" font-size="10" fill="#666">AI 자연어 요약</text>
  <text x="783" y="210" text-anchor="middle" font-size="10" fill="#666">주간·월간 리포트</text>
  <text x="783" y="224" text-anchor="middle" font-size="10" fill="#666">이상 징후 즉시 알림</text>

  <!-- Bottom: 30/90 day note -->
  <rect x="280" y="265" width="340" height="46" rx="8" fill="#111" stroke="#2a2a2a"/>
  <text x="450" y="285" text-anchor="middle" font-size="10" font-weight="700" fill="#f0f0f0">30 / 90일 트렌드 기반 분석</text>
  <text x="450" y="300" text-anchor="middle" font-size="10" fill="#666">단일 통화가 아닌 장기 데이터 누적으로 오탐률 최소화 — 이용 기간이 길수록 정확도 향상</text>
</svg>
