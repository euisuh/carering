<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="-apple-system, 'Noto Sans KR', sans-serif">
  <rect width="780" height="520" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="390" y="38" text-anchor="middle" font-size="17" font-weight="800" fill="#f0f0f0" letter-spacing="-0.5">경쟁사 포지셔닝 매트릭스</text>
  <text x="390" y="57" text-anchor="middle" font-size="11" fill="#555">가족 리포트 제공 여부 × 서비스 접근 방식</text>

  <!-- Chart area -->
  <!-- X axis: B2G (left) → B2C (right) -->
  <!-- Y axis: No report (bottom) → Family report (top) -->

  <!-- Grid background quadrants -->
  <!-- Top-right: CareRing zone (highlight) -->
  <rect x="390" y="90" width="340" height="240" fill="rgba(79,142,247,0.04)" rx="2"/>
  <!-- Other quadrants -->
  <rect x="50" y="90" width="340" height="240" fill="rgba(255,255,255,0.01)" rx="2"/>
  <rect x="50" y="330" width="340" height="140" fill="rgba(255,255,255,0.01)" rx="2"/>
  <rect x="390" y="330" width="340" height="140" fill="rgba(255,255,255,0.01)" rx="2"/>

  <!-- Axes -->
  <!-- X axis -->
  <line x1="50" y1="470" x2="730" y2="470" stroke="#2a2a2a" stroke-width="1.5"/>
  <!-- Y axis -->
  <line x1="390" y1="80" x2="390" y2="470" stroke="#2a2a2a" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Horizontal mid -->
  <line x1="50" y1="330" x2="730" y2="330" stroke="#2a2a2a" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Left boundary -->
  <line x1="50" y1="80" x2="50" y2="470" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- Axis labels -->
  <!-- X axis -->
  <text x="200" y="495" text-anchor="middle" font-size="11" fill="#555">B2G (기관 계약 전용)</text>
  <text x="570" y="495" text-anchor="middle" font-size="11" fill="#888">B2C (개인·가족 직접 가입)</text>
  <!-- Arrow -->
  <polygon points="726,466 730,470 726,474" fill="#555"/>

  <!-- Y axis labels -->
  <text x="36" y="400" text-anchor="middle" font-size="11" fill="#555" transform="rotate(-90, 36, 400)">가족 리포트 없음</text>
  <text x="36" y="200" text-anchor="middle" font-size="11" fill="#888" transform="rotate(-90, 36, 200)">가족 리포트 제공</text>
  <polygon points="46,84 50,80 54,84" fill="#555"/>

  <!-- Quadrant labels -->
  <text x="210" y="105" text-anchor="middle" font-size="10" fill="#333" letter-spacing="0.06em">공공 서비스 영역</text>
  <text x="565" y="105" text-anchor="middle" font-size="10" fill="#4f8ef7" letter-spacing="0.06em" font-weight="700">B2C + 리포트 — 케어링 영역</text>

  <!-- ===== COMPETITOR DOTS ===== -->

  <!-- 클로바 케어콜: B2G, no family report → bottom-left -->
  <circle cx="190" cy="400" r="22" fill="#1a1a1a" stroke="#444" stroke-width="1.5"/>
  <text x="190" y="397" text-anchor="middle" font-size="9" fill="#888">클로바</text>
  <text x="190" y="409" text-anchor="middle" font-size="9" fill="#888">케어콜</text>
  <text x="190" y="430" text-anchor="middle" font-size="9" fill="#555">B2G 전용</text>
  <text x="190" y="443" text-anchor="middle" font-size="9" fill="#555">가족 리포트 없음</text>

  <!-- 효돌 (robot): B2C but no AI report → bottom-right -->
  <circle cx="530" cy="388" r="20" fill="#1a1a1a" stroke="#444" stroke-width="1.5"/>
  <text x="530" y="385" text-anchor="middle" font-size="9" fill="#888">효돌</text>
  <text x="530" y="397" text-anchor="middle" font-size="9" fill="#888">(로봇)</text>
  <text x="530" y="418" text-anchor="middle" font-size="9" fill="#555">장비 비용 높음</text>
  <text x="530" y="431" text-anchor="middle" font-size="9" fill="#555">리포트 없음</text>

  <!-- 통신사 서비스: B2C, no analysis/report → bottom-right -->
  <circle cx="620" cy="415" r="20" fill="#1a1a1a" stroke="#444" stroke-width="1.5"/>
  <text x="620" y="412" text-anchor="middle" font-size="9" fill="#888">통신사</text>
  <text x="620" y="424" text-anchor="middle" font-size="9" fill="#888">안심서비스</text>
  <text x="620" y="445" text-anchor="middle" font-size="9" fill="#555">위치 확인만</text>

  <!-- 다솜: B2C, partial -->
  <circle cx="460" cy="350" r="18" fill="#1a1a1a" stroke="#444" stroke-width="1.5"/>
  <text x="460" y="347" text-anchor="middle" font-size="9" fill="#888">다솜</text>
  <text x="460" y="359" text-anchor="middle" font-size="9" fill="#888">(로봇)</text>
  <text x="460" y="378" text-anchor="middle" font-size="9" fill="#555">장비 필요</text>

  <!-- CareRing: B2C + family report → TOP RIGHT -->
  <circle cx="580" cy="175" r="36" fill="#0f1e3d" stroke="#4f8ef7" stroke-width="2.5"/>
  <text x="580" y="166" text-anchor="middle" font-size="11" font-weight="800" fill="#4f8ef7">케어링</text>
  <text x="580" y="180" text-anchor="middle" font-size="10" fill="#4f8ef7">CareRing</text>
  <text x="580" y="194" text-anchor="middle" font-size="9" fill="#88b4f7">B2C + 리포트</text>

  <!-- Arrow from CareRing to label -->
  <text x="670" y="155" text-anchor="middle" font-size="10" font-weight="700" fill="#4f8ef7">← 유일한</text>
  <text x="670" y="168" text-anchor="middle" font-size="10" font-weight="700" fill="#4f8ef7">B2C 리포트</text>
  <text x="670" y="181" text-anchor="middle" font-size="10" font-weight="700" fill="#4f8ef7">서비스</text>

  <!-- Legend -->
  <rect x="50" y="80" width="120" height="0" rx="0"/>
</svg>
